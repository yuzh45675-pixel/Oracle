# 每 2 天唤醒 API + PostgreSQL（无需 GitHub Secrets，走 Render 上的 DATABASE_URL）
name: Neon Keepalive

on:
  schedule:
    - cron: "0 8 */2 * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping-neon:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Wake Render API and PostgreSQL
        run: |
          for url in \
            "https://oracle-api-ug81.onrender.com/api/health" \
            "https://oracle-tarot-xi.vercel.app/api-server/api/health"; do
            echo "Pinging $url"
            for attempt in 1 2 3; do
              body="$(curl -fsS --max-time 90 "$url" || true)"
              if echo "$body" | grep -q '"storage"[[:space:]]*:[[:space:]]*"postgres"'; then
                echo "OK (postgres): $body"
                break
              fi
              if echo "$body" | grep -q '"ok"[[:space:]]*:[[:space:]]*true'; then
                echo "API up but storage not postgres yet: $body"
                break
              fi
              echo "Attempt $attempt failed, retry in 15s..."
              sleep 15
            done
          done
          echo "Neon keepalive done"
